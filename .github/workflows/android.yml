name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate Flutter project and overlay source
        run: ./scripts/bootstrap-mobile.sh
      - name: Analyze (non-blocking)
        working-directory: mobile/_app
        continue-on-error: true
        run: flutter analyze
      - name: Test (non-blocking)
        working-directory: mobile/_app
        continue-on-error: true
        run: flutter test
      - name: Build debug APK
        working-directory: mobile/_app
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:8000/api/v1' }}
      - uses: actions/upload-artifact@v4
        with:
          name: dole-calendar-debug-apk
          path: mobile/_app/build/app/outputs/flutter-apk/app-debug.apk
